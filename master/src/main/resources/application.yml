quarkus:
  http:
    cors:
      enabled: true
      origins: "http://localhost:3000,https://tsal.al,https://q3.tsal.al,https://q3master.tsal.al,https://www.tsal.al,https://q3srv.tsal.al,http://q3srv.tsal.al"
      methods: "GET,PUT,POST,DELETE,OPTIONS"
      headers: "origin,accept,authorization,content-type,x-requested-with"
      access-control-allow-credentials: true
    proxy:
      proxy-address-forwarding: true
      allow-xForwarded: true
      allow-forwarded: true
    host: 0.0.0.0
  vertx:
    event-loops-pool-size: 24
  thread-pool:
    max-threads: 64

  datasource:
    db-kind: postgresql
    username: ${Q3JS_DB_USER:postgres}
    password: ${Q3JS_DB_PASSWORD:postgres}
    jdbc:
      url: ${Q3JS_DB_URL:jdbc:postgresql://localhost:5432/postgres}
      min-size: 20
      max-size: 120
      acquisition-timeout: 1S
      max-lifetime: 20M
      idle-removal-interval: 2M

  flyway:
    migrate-at-start: true

  jooq:
    dialect: POSTGRES

mp:
  openapi:
    extensions:
      smallrye:
        operationIdStrategy: METHOD

q3js:
  server-info:
    timeout-ms: 3000

